# 프로젝트가 제공할 현재 HTTP 작업을 채우는 시작 양식. 생성된 계약에서만 작성자 주석을 지운다.
# paths가 비어 있는 상태를 구현 가능한 API 계약으로 전달하지 않는다.
# 인증 방식이 합의되면 securitySchemes와 security를 명시한다.
# 각 operation에 고유 operationId와 현재 MVP에 존재하는 REQ/AC ID 배열인 x-requirements를 부여한다.
openapi: 3.1.0
info:
  title: "{{프로젝트 API 이름}}"
  version: "{{API 계약 버전}}"
paths: {}
